<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fartstinker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0a0f1f, #111827 60%, #0f172a);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-wrap {
      text-align: center;
      padding: 32px 24px;
      width: min(900px, 90vw);
    }
    .poop {
      font-size: clamp(8rem, 28vw, 28rem);
      line-height: 1;
      margin: 0;
      display: block;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,0.5));
      animation: bounce 1.5s ease-in-out infinite;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 5vw, 5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      color: #d1d5db;
      font-size: clamp(1rem, 2vw, 1.4rem);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>
  <div class="center-wrap">
    <div class="poop" aria-label="poop emoji">💩</div>
    <h1>Fartstinker</h1>
    <p>The biggest poop-powered website on the internet.</p>
  </div>
</body>
</html>
